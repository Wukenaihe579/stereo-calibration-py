# ============================================================================
# 双目相机标定 — 可调节参数配置
# ============================================================================
# 此文件定义所有可调参数，修改后直接重跑标定即可。
# 流程沿袭参考项目 D:\Qt_project\vision_experiment 的策略：
#   逐对角点检测 → 左右分别单目标定 → 固定内参双目标定 → 输出 YAML
# ============================================================================

# ---------------------------------------------------------------------------
# 标定板参数
# ---------------------------------------------------------------------------
board:
  # 内角点数（不是格子数）。例如 11×8 表示每行 11 个内角点、每列 8 个。
  cols: 11
  rows: 8

  # 方格物理尺寸（毫米）。正方形方格只写 square_size 即可。
  square_size: 6.0

  # 如果方格不是正方形，取消下面两行的注释，覆盖 square_size：
  # col_spacing: 6.0
  # row_spacing: 6.0

  # 标定板图案类型：checkerboard | circle_symmetric | circle_asymmetric
  pattern: checkerboard

# ---------------------------------------------------------------------------
# 角点检测参数
# ---------------------------------------------------------------------------
detection:
  # 是否优先使用 OpenCV SB（Sharpness & Brightness）高精度检测。
  # SB 精度更高，但对模糊/低对比度图像可能失败，失败时自动回退标准检测。
  use_sb: true

  # 允许执行标定的最少有效图片对数量。
  min_pairs: 15

  # 调试时可限制使用的图片对数量（设为空表示不限制）。
  # max_pairs: 10

  # 亚像素优化窗口半径（像素）。
  subpix_window: 11

# ---------------------------------------------------------------------------
# 双目标定参数
# ---------------------------------------------------------------------------
stereo:
  # 是否固定内参只求解 R/T（参考 C++ 项目的策略）。
  fix_intrinsic: true

  # cv2.stereoCalibrate 终止条件
  max_iter: 30
  epsilon: 1.0e-6

# ---------------------------------------------------------------------------
# 图片格式
# ---------------------------------------------------------------------------
image:
  extensions: [".bmp", ".png", ".jpg", ".jpeg", ".tiff", ".tif"]

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  # 左右标定图片目录（相对 configs/ 目录，也支持绝对路径）
  left_dir: ../data/left
  right_dir: ../data/right

  # 标定结果输出路径（相对 configs/ 目录或绝对路径）
  output: ../data/stereo_calib_data.yaml

# ---------------------------------------------------------------------------
# 输出内容控制（默认全部输出即可）
# ---------------------------------------------------------------------------
output:
  # YAML 文件格式兼容 OpenCV FileStorage，可直接被
  # python_stereo_structured_light 等项目 load_stereo_calibration() 读取。
  save_rectification_maps: false   # 是否保存校正映射表（.npz，体积较大）
